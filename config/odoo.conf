[options]
; Chemin vers les modules additionnels personnalisés
addons_path = /mnt/extra-addons

; Répertoire de stockage des données (sessions, filestore)
data_dir = /var/lib/odoo

; Mot de passe Master pour créer, dupliquer, sauvegarder ou supprimer des bases de données
admin_passwd = admin_super_secret_passwd

; Paramètres de connexion PostgreSQL
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo_secure_password_123

; Gestionnaire de bases de données actif
list_db = True

; Mode proxy (recommandé pour les redirections et en-têtes X-Forwarded-*)
proxy_mode = True

; Journalisation dans la sortie standard pour docker logs
logfile = False
log_level = info
